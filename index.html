<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1624">
<meta name="mobile-web-app-capable" content="yes">
<title>소리메모</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  color-scheme: dark;
  --bg:#121A2A; --bg2:#0F1624; --s1:#1A2438; --s2:#212D45; --line:#2B3853; --line2:#36456A;
  --ink:#EAF0FA; --sub:#93A1BC; --dim:#64728F;
  --p:#3FE0B0; --p2:#1FA882; --p-soft:rgba(63,224,176,.14);
  --c:#6E9BFF; --c2:#3D6BE0; --c-soft:rgba(110,155,255,.15);
  --red:#FF7A7A; --amber:#F4BF55;
  --r-lg:22px; --r:14px; --r-sm:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100dvh;color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Noto Sans KR",sans-serif;font-size:16px;line-height:1.55;letter-spacing:-0.01em;
  background:radial-gradient(120% 60% at 0% 0%, rgba(63,224,176,.07), transparent 60%),radial-gradient(120% 60% at 100% 0%, rgba(110,155,255,.09), transparent 60%),var(--bg);background-attachment:fixed}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
svg{width:22px;height:22px;flex:none}
:focus-visible{outline:2px solid var(--c);outline-offset:2px;border-radius:8px}
#app{max-width:640px;margin:0 auto}

/* 상단 */
.top{position:sticky;top:0;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 18px 12px;background:linear-gradient(var(--bg) 70%, transparent)}
.top h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-0.03em}
.top-r{display:flex;align-items:center;gap:4px}
.page-top h1{font-size:18px}
.ibtn{display:grid;place-items:center;min-width:40px;height:40px;border-radius:12px;color:var(--sub)}
.ibtn:active{background:var(--s1)}
.ibtn.txt{font-size:13px;padding:0 10px;border:1px solid var(--line);color:var(--sub)}
.main{padding:4px 18px 24px}
body[data-view="tab"] .main{padding-bottom:calc(196px + env(safe-area-inset-bottom))}

/* 하단 도크: 녹음 + 탭 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:640px;margin:0 auto;padding:12px 14px 0;
  background:linear-gradient(to top, var(--bg2) 72%, rgba(15,22,36,0));}
.recs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.rec{display:flex;border-radius:18px;overflow:hidden;color:#fff}
.rec.personal{background:linear-gradient(135deg,#46E6B6,#17997A);box-shadow:0 10px 28px -8px rgba(63,224,176,.55)}
.rec.company{background:linear-gradient(135deg,#7FA6FF,#335FD6);box-shadow:0 10px 28px -8px rgba(110,155,255,.6)}
.rec-mic{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:62px;font-size:19px;font-weight:800;letter-spacing:-0.02em}
.rec-mic svg{width:24px;height:24px}
.rec-pen{width:50px;display:grid;place-items:center;border-left:1px solid rgba(255,255,255,.28);background:rgba(0,0,0,.08)}
.rec-pen svg{width:19px;height:19px}
.rec button:active{background:rgba(0,0,0,.15)}
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);padding:6px 0 calc(8px + env(safe-area-inset-bottom));background:var(--bg2);margin:0 -14px}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:11px;font-weight:600;color:var(--dim)}
.tabbar button.on{color:var(--ink)}
.tabbar button.on svg{filter:drop-shadow(0 0 8px rgba(110,155,255,.6))}

/* 검색·세그먼트·칩 */
.search{display:flex;align-items:center;gap:8px;height:46px;padding:0 14px;border-radius:var(--r);background:var(--s1);border:1px solid var(--line);color:var(--dim);margin-bottom:12px}
.search input{flex:1;background:none;border:0;outline:0;color:var(--ink);min-width:0}
.search svg{width:18px;height:18px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:14px;background:var(--s1);border:1px solid var(--line);margin-bottom:10px}
.seg button{height:36px;border-radius:10px;font-size:14px;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--s2);color:var(--ink)}
.seg button.on.personal{background:var(--p-soft);color:var(--p)}
.seg button.on.company{background:var(--c-soft);color:var(--c)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{white-space:nowrap;padding:6px 12px;border-radius:999px;font-size:13px;color:var(--sub);border:1px solid var(--line)}
.chip.on{color:var(--ink);border-color:var(--ink);background:var(--s2)}

/* 날짜 묶음 */
.day{display:flex;align-items:center;gap:8px;margin:22px 2px 10px;font-size:13px;font-weight:700;color:var(--sub)}
.day em{font-style:normal;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--s2);color:var(--sub)}
.day.late{color:var(--red)} .day.now{color:var(--amber)}

/* 메모 카드 */
.pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700}
.pill.personal{background:var(--p-soft);color:var(--p)} .pill.company{background:var(--c-soft);color:var(--c)}
.pill.big{height:28px;padding:0 12px;font-size:13px}
.item{display:block;width:100%;text-align:left;padding:14px 16px 13px;margin-bottom:8px;border-radius:var(--r-lg);background:var(--s1);border:1px solid var(--line);position:relative;overflow:hidden}
.item::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0}
.item.personal::before{background:var(--p)} .item.company::before{background:var(--c)}
.item:active{background:var(--s2)}
.it-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.it-head .sub{font-size:12px;color:var(--sub)}
.it-head .time{margin-left:auto;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.it-title{font-size:17px;font-weight:700;letter-spacing:-0.02em;line-height:1.35}
.it-sum{margin-top:4px;font-size:14px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:12px}
.it-meta:empty{display:none}
.mt{display:inline-flex;align-items:center;gap:3px;color:var(--sub)} .mt svg{width:14px;height:14px}
.tg{color:var(--dim)}
.st{color:var(--amber);font-weight:600} .st.err{color:var(--red)}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:56px 24px;color:var(--sub);font-size:14px}
.empty b{color:var(--ink);font-size:16px}
.empty.small{padding:20px}
.hint-line{font-size:13px;color:var(--dim);margin:6px 2px 12px}

/* 캘린더 */
.cal{padding:12px;border-radius:var(--r-lg);background:var(--s1);border:1px solid var(--line)}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.today-btn{padding:6px 14px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--sub)}
.wd,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.wd span{text-align:center;font-size:12px;color:var(--dim);padding:4px 0}
.wd .sun,.cd.sun .n{color:var(--red)}
.cd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 5px;border-radius:12px;min-height:54px}
.cd .n{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.cd.today .n{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cd.sel{background:var(--s2)}
.cd.sel .n{background:var(--ink);color:var(--bg)}
.evbar{width:18px;height:3px;border-radius:2px}
.evbar.personal{background:var(--p)} .evbar.company{background:var(--c)} .evbar.none{background:transparent}
.dots{display:flex;gap:3px;height:6px}
.dots i,.legend i{width:6px;height:6px;border-radius:50%;display:inline-block}
i.personal{background:var(--p)} i.company{background:var(--c)} i.due{background:var(--red)}
.legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:8px;font-size:11px;color:var(--dim)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i.bar{width:12px;height:3px;border-radius:2px;background:var(--sub)}
.ag-h{font-size:12px;color:var(--dim);font-weight:600;margin:14px 2px 6px}
.ag{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:var(--r);background:var(--s1);border:1px solid var(--line);margin-bottom:6px}
.ag-time{min-width:44px;font-weight:800;font-variant-numeric:tabular-nums}
.ag.personal .ag-time{color:var(--p)} .ag.company .ag-time{color:var(--c)}
.ag-body{flex:1;display:flex;flex-direction:column} .ag-body small{color:var(--dim);font-size:12px}
.ok{font-size:12px;color:var(--p);font-weight:600;white-space:nowrap}

/* 할 일 */
.todo-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--r);background:var(--s1);border:1px solid var(--line);margin-bottom:6px}
.chk{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line2);display:grid;place-items:center;font-size:14px;font-weight:900;color:var(--bg)}
.done .chk.personal{background:var(--p);border-color:var(--p)} .done .chk.company{background:var(--c);border-color:var(--c)}
.tr-body{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column}
.tr-body b{font-weight:600;font-size:15px}
.tr-body small{font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.done .tr-body b{text-decoration:line-through;color:var(--dim)}
.more{display:block;margin:16px auto;padding:8px 16px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--sub)}
.mini{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);color:var(--sub)}
.mini svg{width:18px;height:18px}

/* 태그 */
.tags{display:flex;flex-direction:column;gap:6px}
.tagrow{display:grid;grid-template-columns:1fr 64px 28px;grid-template-rows:auto auto;column-gap:12px;align-items:center;padding:13px 16px;border-radius:var(--r);background:var(--s1);border:1px solid var(--line);text-align:left}
.tr-name{font-weight:700;font-size:16px}
.tr-bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--s2)}
.tr-bar i{display:block;height:100%}
.tr-n{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.tr-last{grid-column:1/-1;font-size:12px;color:var(--dim)}
.crumb{display:inline-flex;align-items:center;gap:2px;font-size:14px;color:var(--sub);margin:0 0 6px -6px}
.crumb svg{width:18px;height:18px}
.tl-sum{font-size:13px;color:var(--dim);margin:0 0 16px}
.timeline{list-style:none;margin:0;padding:0 0 0 18px;position:relative}
.timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.timeline li{position:relative;margin-bottom:14px}
.timeline li::before{content:"";position:absolute;left:-18px;top:5px;width:12px;height:12px;border-radius:50%;border:3px solid var(--bg)}
.timeline li.personal::before{background:var(--p)} .timeline li.company::before{background:var(--c)}
.tl-date{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:6px;font-variant-numeric:tabular-nums}
.tl-card{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;padding:12px 14px;border-radius:var(--r);background:var(--s1);border:1px solid var(--line)}
.tl-card span{font-size:14px;color:var(--sub)} .tl-card small{font-size:12px;color:var(--amber)}

/* 녹음 화면 — 이 앱의 주인공 */
body[data-view="record"]{overflow:hidden}
.recording{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(22px + env(safe-area-inset-top)) 22px 0;text-align:center}
.recording.personal{background:radial-gradient(90% 60% at 50% 38%, rgba(63,224,176,.30), transparent 70%),linear-gradient(#0E2622,#0F1624)}
.recording.company{background:radial-gradient(90% 60% at 50% 38%, rgba(110,155,255,.32), transparent 70%),linear-gradient(#111D3A,#0F1624)}
.rc-top{display:flex;width:100%;justify-content:space-between;align-items:center}
.rc-live{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--sub)}
.rc-live i{width:9px;height:9px;border-radius:50%;background:var(--red);animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.rc-time{margin-top:12vh;font-size:76px;font-weight:200;letter-spacing:-0.04em;font-variant-numeric:tabular-nums;line-height:1}
.wave{width:100%;height:150px;margin-top:5vh}
.rc-hint{max-width:280px;font-size:14px;color:var(--sub);margin-top:2vh}
.rc-bottom{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:14px;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
.rc-stop{width:96px;height:96px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:700;color:#fff}
.rc-stop span{width:24px;height:24px;border-radius:6px;background:#fff}
.personal .rc-stop{background:linear-gradient(135deg,#46E6B6,#17997A);box-shadow:0 0 0 8px rgba(63,224,176,.16),0 16px 40px -10px rgba(63,224,176,.7)}
.company .rc-stop{background:linear-gradient(135deg,#7FA6FF,#335FD6);box-shadow:0 0 0 8px rgba(110,155,255,.18),0 16px 40px -10px rgba(110,155,255,.7)}
.rc-cancel{font-size:14px;color:var(--dim);padding:8px 14px}

/* 상세 */
.hero{padding:6px 2px 10px}
.when{font-size:13px;color:var(--dim);margin:0 0 6px}
.d-title{font-size:26px;font-weight:800;letter-spacing:-0.03em;line-height:1.25;margin:0}
.d-sum{font-size:16px;color:#CDD6E6;margin:12px 0 0;line-height:1.65}
.busy{display:inline-flex;align-items:center;gap:8px;color:var(--amber);font-size:14px;font-weight:600;margin:12px 0 0}
.busy i{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
.busy.sm{font-size:13px;margin:0}
@keyframes spin{to{transform:rotate(360deg)}}
.errbox{margin-top:12px;padding:12px;border-radius:var(--r);border:1px solid rgba(255,122,122,.4);background:rgba(255,122,122,.08)}
.errbox p{margin:0 0 10px;font-size:13px;color:var(--red);word-break:break-all}
.blk{margin:12px 0;padding:16px;border-radius:var(--r-lg);background:var(--s1);border:1px solid var(--line)}
.blk h3{display:flex;align-items:center;gap:6px;margin:0 0 12px;font-size:14px;font-weight:700;color:var(--sub)}
.blk h3 em{font-style:normal;font-size:12px;padding:0 7px;border-radius:999px;background:var(--s2)}
.blk .todo-row{background:var(--s2);border-color:transparent}
.none{margin:0;font-size:14px;color:var(--dim)}
.field{display:block;width:100%;padding:11px 13px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);color:var(--ink);outline:0;margin-top:8px}
.field:focus{border-color:var(--c)}
textarea.field{min-height:100px;resize:vertical;line-height:1.6}
textarea.field.big{min-height:200px}
.lbl{display:block;font-size:13px;color:var(--sub);margin-top:14px}
.ev{padding:12px;border-radius:var(--r);background:var(--s2);margin-bottom:8px}
.ev .field{margin-top:0;background:var(--bg2)}
.ev-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 10px}
.ev-grid .field:first-child{grid-column:1/-1}
.field{min-width:0}
.ev-grid .field{padding:9px 8px;font-size:14px}
.ev-done{display:flex;justify-content:space-between;align-items:center}
.link{font-size:13px;color:var(--sub);text-decoration:underline;text-underline-offset:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:14px;font-weight:700;font-size:15px;cursor:pointer}
.btn svg{width:19px;height:19px}
.btn.sm{height:38px;padding:0 13px;font-size:13px;border-radius:11px}
.btn.wide{width:100%;margin-top:6px}
.btn.primary{color:#fff}
.btn.primary.personal{background:linear-gradient(135deg,#46E6B6,#17997A)}
.btn.primary.company{background:linear-gradient(135deg,#7FA6FF,#335FD6)}
.btn.ghost{border:1px solid var(--line2);color:var(--ink)}
.btn.danger{border:1px solid rgba(255,122,122,.35);color:var(--red);margin-top:18px}
audio{width:100%;margin-bottom:8px}
details summary{cursor:pointer;color:var(--sub);font-size:14px;padding:4px 0}
details .btn{margin-top:10px}

/* 사진 */
.pa{padding:10px 0;border-top:1px solid var(--line)}
.pa:first-of-type{border-top:0;padding-top:0}
.pa-row{display:flex;gap:12px;align-items:flex-start}
.pa-row img{width:76px;height:76px;object-fit:cover;border-radius:12px;cursor:pointer;flex:none;background:var(--s2)}
.pa-act{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.pa-act .err{width:100%;margin:0;font-size:12px;color:var(--red)}
.pa-text{margin-top:10px;padding:12px;border-radius:12px;background:var(--s2);font-size:14px;white-space:pre-wrap;line-height:1.6}
.pa-foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.photos:empty{display:none}
.ph{position:relative;border-radius:12px;overflow:hidden}
.ph img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.ph span{position:absolute;right:6px;bottom:6px;font-size:11px;padding:2px 7px;border-radius:999px;background:rgba(0,0,0,.6)}
.viewer{position:fixed;inset:0;background:rgba(5,8,14,.94);display:flex;align-items:center;justify-content:center;z-index:20}
.viewer img{max-width:100%;max-height:100%}

@media (prefers-reduced-motion: reduce){ *{animation:none!important} }
</style>
</head>
<body data-view="tab">
<div id="app"></div>
<script>

/* ===== 설정값 ===== */
const SUBS = {
  company: ['거래처','구매','품질/클레임','영업/견적','생산/인력','경영/보고','기타'],
  personal: ['가족','신앙','투자','건강/러닝','아이디어','기타']
};
const CAT = {company:'회사', personal:'개인'};
const S = {
  get(k,d=''){ try{ return localStorage.getItem('sm_'+k) ?? d }catch{ return d } },
  set(k,v){ try{ localStorage.setItem('sm_'+k,v) }catch{} }
};
/* 골방 기도실 키 자동 가져오기 (같은 24aug30.github.io 주소일 때) */
function gobangKey(name){ try{ const v = localStorage.getItem(name); return v ? String(JSON.parse(v)||'').trim() : ''; }catch{ return ''; } }
function importGobangKeys(force){
  let n = 0;
  const o = gobangKey('k-openai'), c = gobangKey('k-claude');
  if(o && (force || !S.get('openai'))){ S.set('openai', o); n++; }
  if(c && (force || !S.get('anthropic'))){ S.set('anthropic', c); n++; }
  return n;
}
importGobangKeys(false);
const state = {view:'home', id:null, filter:{cat:'all', sub:'', q:''}};
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ===== 저장소 (IndexedDB: 녹음 파일까지 폰에 저장) ===== */
let dbp;
function db(){
  return dbp ||= new Promise((res,rej)=>{
    const r = indexedDB.open('sorimemo',1);
    r.onupgradeneeded = () => r.result.createObjectStore('memos',{keyPath:'id'});
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function tx(mode, fn){
  const d = await db();
  return new Promise((res,rej)=>{
    const t = d.transaction('memos',mode); const r = fn(t.objectStore('memos'));
    t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error);
  });
}
const put = m => tx('readwrite', s => s.put(m));
const get = id => tx('readonly', s => s.get(id));
const all = () => tx('readonly', s => s.getAll());
const del = id => tx('readwrite', s => s.delete(id));

/* ===== AI: 전사 (OpenAI) ===== */
async function transcribe(blob){
  const key = S.get('openai'); if(!key) throw new Error('OpenAI 키가 없습니다. 설정에서 입력해 주세요.');
  const ext = (blob.type||'').includes('mp4') ? 'm4a' : 'webm';
  const fd = new FormData();
  fd.append('file', blob, 'memo.'+ext);
  fd.append('model', S.get('sttModel','whisper-1'));
  fd.append('language','ko');
  const vocab = S.get('vocab'); if(vocab) fd.append('prompt', vocab.slice(0,800));
  const r = await fetch('https://api.openai.com/v1/audio/transcriptions',{method:'POST',headers:{Authorization:'Bearer '+key},body:fd});
  if(!r.ok) throw new Error('전사 실패 ('+r.status+'): '+(await r.text()).slice(0,200));
  return (await r.json()).text || '';
}

/* ===== AI: 정리·분류 (Claude) ===== */
async function analyze(m){
  const key = S.get('anthropic'); if(!key) throw new Error('Claude 키가 없습니다. 설정에서 입력해 주세요.');
  const subs = SUBS[m.cat].join(', ');
  const sys = `너는 사용자의 음성 메모를 정리하는 비서다. 이 메모는 사용자가 "${CAT[m.cat]}" 메모로 직접 분류했다.
메모 작성 시각: ${kstFull(m.createdAt)} (한국 시간). "내일", "다음 주 화요일" 같은 표현은 이 시각 기준으로 실제 날짜로 바꿔라.
${S.get('vocab') ? '자주 나오는 이름·용어(전사 오타 교정과 태그에 참고): '+S.get('vocab') : ''}

반드시 아래 JSON만 출력하라. 설명·코드블록 금지.
{"title":"15자 이내 제목","summary":"핵심 2~3문장","sub":"다음 중 하나: ${subs}","tags":["#거래처명이나 프로젝트명 등 고유명사 위주, 최대 4개"],"todos":[{"text":"할 일","due":"YYYY-MM-DD 또는 null"}],"events":[{"title":"일정 제목","date":"YYYY-MM-DD","start":"HH:MM 또는 null","end":"HH:MM 또는 null"}]}

규칙:
- 메모에 없는 내용은 지어내지 마라.
- todos는 사용자가 해야 할 행동이 분명할 때만. 없으면 [].
- events는 날짜가 특정되는 약속·미팅·마감만. 날짜가 애매하면 넣지 말고 todos로. 없으면 [].
- 소분류가 애매하면 "기타".`;
  const r = await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true','content-type':'application/json'},
    body: JSON.stringify({model:S.get('claudeModel','claude-sonnet-5-5'),max_tokens:1500,system:sys,messages:[{role:'user',content:memoSource(m)}]})
  });
  if(!r.ok) throw new Error('정리 실패 ('+r.status+'): '+(await r.text()).slice(0,200));
  const txt = (await r.json()).content?.map(c=>c.text||'').join('') || '';
  const a = txt.indexOf('{'), b = txt.lastIndexOf('}');
  if(a<0||b<0) throw new Error('AI 응답을 읽지 못했습니다.');
  return JSON.parse(txt.slice(a,b+1));
}

function memoSource(m){
  let s = m.transcript ? '메모 원문:\n'+m.transcript : '';
  const pa = (m.photos||[]).filter(p=>p.analysis);
  if(pa.length) s += '\n\n첨부 사진 분석 내용:\n' + pa.map((p,i)=>`[사진 ${i+1}] ${p.analysis}`).join('\n');
  return s.trim();
}

function blobToB64(blob){ return new Promise((res,rej)=>{ const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = () => rej(r.error); r.readAsDataURL(blob); }); }
async function analyzePhotoAI(m, p){
  const key = S.get('anthropic'); if(!key) throw new Error('Claude 키가 없습니다. 설정에서 입력해 주세요.');

${S.get('vocab') ? '\n자주 나오는 이름·용어: '+S.get('vocab') : ''}

한국어로 정리하라. 형식:

• 핵심 내용: 사진 속 중요한 정보 3~6줄. 글자·숫자(치수, 금액, 날짜, 연락처, 품번 등)는 보이는 그대로 옮겨 적어라.
• 확인 필요: 흐리거나 확실하지 않은 부분이 있으면 적고, 없으면 생략.
사진에 없는 내용은 추측하지 마라.`;
  const r = await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true','content-type':'application/json'},
    body: JSON.stringify({model:S.get('claudeModel','claude-sonnet-5-5'),max_tokens:1200,messages:[{role:'user',content:[
      {type:'image',source:{type:'base64',media_type:p.blob.type||'image/jpeg',data}},
      {type:'text',text:prompt}
    ]}]})
  });
  if(!r.ok) throw new Error('사진 분석 실패 ('+r.status+'): '+(await r.text()).slice(0,200));
  return (await r.json()).content?.map(c=>c.text||'').join('').trim() || '';
}

/* ===== 사진 저장 (긴 변 1600px로 줄여 저장 공간·비용 절약) ===== */
async function shrink(file){
  try{
    const bmp = await createImageBitmap(file,{imageOrientation:'from-image'});
    const sc = Math.min(1, 1600/Math.max(bmp.width,bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width*sc); c.height = Math.round(bmp.height*sc);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(res => c.toBlob(b => res(b||file),'image/jpeg',0.85));
  }catch{ return file; }
}
async function filesToPhotos(files){
  const out = [];
  for(const f of files){ if(!f.type.startsWith('image/')) continue; out.push({id:'p'+Date.now()+Math.random().toString(36).slice(2,6), blob:await shrink(f), analysis:'', status:'idle', error:null}); }
  return out;
}
async function addPhotos(files){
  const m = await get(state.id); const ps = await filesToPhotos(files);
  m.photos = [...(m.photos||[]), ...ps]; await put(m); renderDetail();
}
async function analyzePhoto(pid){
  let m = await get(state.id); let p = m.photos.find(x=>x.id===pid);
  p.status = 'analyzing'; p.error = null; await put(m); renderDetail();
  try{
    const a = await analyzePhotoAI(m, p);
    m = await get(m.id); p = m.photos.find(x=>x.id===pid); if(!p) return;
    p.analysis = a; p.status = 'done';
  }catch(e){
    m = await get(m.id); p = m.photos.find(x=>x.id===pid); if(!p) return;
    p.status = 'error'; p.error = String(e.message||e);
  }
  await put(m); if(state.view==='detail' && state.id===m.id) renderDetail();
}
async function delPhoto(pid){
  if(!confirm('이 사진을 삭제할까요?')) return;
  const m = await get(state.id); m.photos = m.photos.filter(x=>x.id!==pid); await put(m); renderDetail();
}
async function viewPhoto(pid){

  const v = document.createElement('div'); v.className = 'viewer';
  const url = URL.createObjectURL(p.blob);
  v.innerHTML = `<img src="${url}">`; v.onclick = () => { URL.revokeObjectURL(url); v.remove(); };
  document.body.appendChild(v);
}

async function processMemo(id){
  let m = await get(id); if(!m) return;
  const save = async () => { m.photos = (await get(id))?.photos ?? m.photos; await put(m); };
  if(!m.transcript && !m.audio && !(m.photos||[]).some(p=>p.analysis)){ m.status='done'; await put(m); return refresh(id); }
  try{
    if(!m.transcript && m.audio){
      m.status='transcribing'; m.error=null; await save(); refresh(id);
      m.transcript = await transcribe(m.audio); await save();
    }
    m.status='analyzing'; m.error=null; await save(); refresh(id);
    const r = await analyze(m);
    Object.assign(m,{
      title: r.title || '제목 없음',
      summary: r.summary || '',
      sub: SUBS[m.cat].includes(r.sub) ? r.sub : '기타',
      tags: (r.tags||[]).map(t => t.startsWith('#') ? t : '#'+t),
      todos: (r.todos||[]).map(t => ({text:t.text, due:t.due||null, done:false, added:false})),
      events: (r.events||[]).map(e => ({title:e.title||'', date:e.date||'', start:e.start||'', end:e.end||'', added:false})),
      status:'done', error:null
    });
    m.photos = (await get(id))?.photos ?? m.photos;
    await put(m);
  }catch(e){
    m.status='error'; m.error=String(e.message||e);
    m.photos = (await get(id))?.photos ?? m.photos;
    await put(m);
  }
  refresh(id);
}

/* ===== 구글 캘린더 (버튼 한 번 → 캘린더 등록 화면) ===== */
function gcalUrl({title,date,start,end}, m){
  const d = date.replace(/-/g,'');
  let dates;
  if(start){
    let e = end;
    if(!e){ const [h,mi] = start.split(':').map(Number); const t = Math.min(h*60+mi+60, 23*60+59); e = String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); }
    dates = `${d}T${start.replace(':','')}00/${d}T${e.replace(':','')}00`;
  } else dates = `${d}/${nextDay(date).replace(/-/g,'')}`;
  const p = new URLSearchParams({action:'TEMPLATE', text:`[${CAT[m.cat]}] ${title}`, dates, ctz:'Asia/Seoul', details:(m.summary||'')+'\n\n— 소리메모'});
  return 'https://calendar.google.com/calendar/render?'+p.toString();
}

  const m = await get(state.id); const ev = m.events[i];
  if(!ev.date){ alert('날짜를 입력해 주세요.'); return; }
  window.open(gcalUrl(ev,m),'_blank');
  ev.added = true; await put(m); renderDetail();
}

  const m = await get(state.id); const t = m.todos[i];
  window.open(gcalUrl({title:'할 일: '+t.text, date:t.due, start:'', end:''}, m),'_blank');
  t.added = true; await put(m); renderDetail();
}

function calShift(n){

  state.cal.y = y; state.cal.m = m; renderTab();
}
function calToday(){ const [y,m] = todayKST().split('-').map(Number); Object.assign(state.cal,{y, m:m-1, sel:todayKST()}); renderTab(); }
function calTab(memos){
  const {y,m,sel} = state.cal;
  const map = {};
  const slot = d => map[d] ||= {p:0,c:0,ev:[],td:[],memos:[]};
  for(const mm of memos){
    const s = slot(kstDate(mm.createdAt)); s[mm.cat==='personal'?'p':'c']++; s.memos.push(mm);
    (mm.events||[]).forEach((e,i)=>{ if(e.date) slot(e.date).ev.push({...e, m:mm, i}); });
    (mm.todos||[]).forEach((t,i)=>{ if(t.due) slot(t.due).td.push({...t, m:mm, i}); });
  }
  const first = new Date(Date.UTC(y,m,1)).getUTCDay();

  for(let d=1; d<=nd; d++){
    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

  const agenda = (!evs.length && !s.td.length && !s.memos.length)

       ${s.memos.length?`<h3 class="ag-h">이날의 메모</h3>${s.memos.map(memoCard).join('')}`:''}`;
  shell(`${y}년 ${m+1}월`, `
    <div class="cal">
      <div class="cal-nav">
        <button class="ibtn" onclick="calShift(-1)" aria-label="이전 달">${IC.left}</button>

      <div class="grid">${cells}</div>

async function toggleTodoAt(id, i){
  const m = await get(id); if(!m || !m.todos[i]) return;

  if(state.view==='detail') renderDetail(); else renderTab();
}
function todoTab(memos){
  const c = state.todoCat, today = todayKST();
  const items = [];
  for(const m of memos){ if(c!=='all' && m.cat!==c) continue; (m.todos||[]).forEach((t,i)=>items.push({...t, m, i})); }
  const open = items.filter(t=>!t.done), done = items.filter(t=>t.done);
  const groups = [
    ['지난 마감', open.filter(t=>t.due && t.due<today), 'late'],
    ['오늘', open.filter(t=>t.due===today), 'now'],
    ['7일 안에', open.filter(t=>t.due && t.due>today && daysBetween(today,t.due)<=7), ''],
    ['그 이후', open.filter(t=>t.due && daysBetween(today,t.due)>7), ''],
    ['마감 없음', open.filter(t=>!t.due), '']
  ];
  const row = t => `<div class="todo-row ${t.done?'done':''}">
    <button class="chk ${t.m.cat}" onclick="toggleTodoAt('${t.m.id}',${t.i})" aria-label="완료 표시">${t.done?'✓':''}</button>
    <button class="tr-body" onclick="go('detail','${t.m.id}')"><b>${esc(t.text)}</b><small>${t.due?shortDay(t.due)+' 마감 · ':''}${esc(t.m.title||'')}</small></button>
  </div>`;
  shell('할 일', `
    <div class="seg">${['all','personal','company'].map(k=>`<button class="${c===k?'on '+k:''}" onclick="state.todoCat='${k}';renderTab()">${k==='all'?'전체':CAT[k]}</button>`).join('')}</div>
    ${open.length ? groups.filter(g=>g[1].length).map(([h,arr,cls])=>`<h2 class="day ${cls}">${h}<em>${arr.length}</em></h2>${arr.sort((a,b)=>(a.due||'').localeCompare(b.due||'')).map(row).join('')}`).join('')
      : `<div class="empty"><b>남은 할 일이 없습니다</b><span>메모에서 할 일이 나오면 여기에 모입니다.</span></div>`}
    ${done.length?`<button class="more" onclick="state.showDone=!state.showDone;renderTab()">${state.showDone?'완료 숨기기':`완료한 일 ${done.length}개 보기`}</button>${state.showDone?done.map(row).join(''):''}`:''}`);
}

let rec, chunks, stream, startT, timerI, recCat, cancelled, ac, raf;
function startViz(color){
  try{
    ac = new (window.AudioContext||window.webkitAudioContext)();
    const an = ac.createAnalyser(); an.fftSize = 512;
    ac.createMediaStreamSource(stream).connect(an);
    const data = new Uint8Array(an.fftSize), bars = [], N = 56; let lastT = 0;
    const cv = document.getElementById('wave'); const ctx = cv.getContext('2d');
    const draw = t => {
      if(!document.getElementById('wave')) return;
      const dpr = devicePixelRatio||1, W = cv.clientWidth*dpr, H = cv.clientHeight*dpr;
      if(cv.width!==W) cv.width = W; if(cv.height!==H) cv.height = H;
      an.getByteTimeDomainData(data);
      let sum = 0; for(const v of data){ const d=(v-128)/128; sum += d*d; }
      const lvl = Math.min(1, Math.sqrt(sum/data.length)*5);
      if(t-lastT > 70){ bars.push(lvl); if(bars.length>N) bars.shift(); lastT = t; }
      ctx.clearRect(0,0,W,H);
      const bw = W/N;
      bars.forEach((b,i)=>{
        const h = Math.max(3*dpr, b*H*0.92), x = (N-bars.length+i)*bw + bw*0.28, w = bw*0.44;
        ctx.globalAlpha = 0.25 + 0.75*((N-bars.length+i)/N);
        ctx.fillStyle = color;
        ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x,(H-h)/2,w,h,w/2) : ctx.rect(x,(H-h)/2,w,h); ctx.fill();
      });
      raf = requestAnimationFrame(draw);
    };
    raf = requestAnimationFrame(draw);
  }catch{}
}
function stopViz(){ cancelAnimationFrame(raf); try{ ac && ac.state!=='closed' && ac.close(); }catch{} ac = null; }
async function startRec(cat){
  if(!S.get('openai') || !S.get('anthropic')){ alert('먼저 설정에서 API 키를 입력해 주세요.'); return go('settings'); }
  try{ stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ alert('마이크 권한이 필요합니다. 브라우저 설정에서 마이크를 허용해 주세요.'); return; }
  const mime = ['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
  rec = new MediaRecorder(stream, mime ? {mimeType:mime} : undefined);
  chunks = []; recCat = cat; cancelled = false;
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = finishRec;
  rec.start(1000); startT = Date.now();
  state.view = 'record'; document.body.dataset.view = 'record';
  $app.innerHTML = `<div class="recording ${cat}">
    <div class="rc-top"><span class="pill ${cat} big">${CAT[cat]} 메모</span><span class="rc-live"><i></i>녹음 중</span></div>
    <div class="rc-time" id="tm">00:00</div>
    <canvas id="wave" class="wave"></canvas>
    <p class="rc-hint">말을 마치면 완료를 누르세요. 글로 바꾸고 정리까지 자동으로 합니다.</p>
    <div class="rc-bottom">
      <button class="rc-stop" onclick="stopRec()"><span></span>완료</button>
      <button class="rc-cancel" onclick="cancelRec()">버리기</button>
    </div>
  </div>`;
  startViz(cat==='personal' ? '#3FE0B0' : '#6E9BFF');
  timerI = setInterval(()=>{ const s = Math.floor((Date.now()-startT)/1000); const el = document.getElementById('tm'); if(el) el.textContent = String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }, 300);
}
function stopRec(){ clearInterval(timerI); stopViz(); if(rec && rec.state!=='inactive') rec.stop(); }
function cancelRec(){ if(!confirm('이 녹음을 버릴까요?')) return; cancelled = true; stopRec(); }
async function finishRec(){
  stream?.getTracks().forEach(t => t.stop());
  if(cancelled) return go('tab');
  const blob = new Blob(chunks,{type:rec.mimeType||'audio/webm'});
  const m = {id:'m'+Date.now(), cat:recCat, createdAt:startT, audio:blob, duration:Math.round((Date.now()-startT)/1000), transcript:'', photos:[], status:'transcribing', title:'', summary:'', sub:'', tags:[], todos:[], events:[]};
  await put(m);
  go('detail', m.id);
  processMemo(m.id);
}

      const url = URL.createObjectURL(p.blob);
      const btn = p.status==='analyzing' ? '<span class="busy sm"><i></i>분석 중</span>'
        : `<button class="btn ${p.analysis?'ghost':'primary '+m.cat} sm" onclick="analyzePhoto('${p.id}')">${p.analysis?'다시 분석':'AI 분석'}</button>`;
      return `<div class="pa">
        <div class="pa-row"><img src="${url}" onclick="viewPhoto('${p.id}')" alt="첨부 사진">
          <div class="pa-act">${btn}<button class="link" onclick="delPhoto('${p.id}')">삭제</button>
          ${p.status==='error'?`<p class="err">${esc(p.error)}</p>`:''}</div></div>
        ${p.analysis?`<div class="pa-text">${esc(p.analysis)}</div>`:''}
      </div>`;
    }).join('')}
    <div class="pa-foot">
      <label class="btn ghost sm">${IC.cam}사진 추가<input type="file" accept="image/*" multiple hidden onchange="addPhotos(this.files)"></label>
      ${hasA && m.status!=='analyzing' && m.status!=='transcribing' ? `<button class="btn ghost sm" onclick="processMemo('${m.id}')">사진 내용으로 메모 정리</button>` : ''}
    </div>
  </section>`;
}
async function upd(k,v){ const m = await get(state.id); m[k] = v; await put(m); }
async function updEv(i,k,v){ const m = await get(state.id); m.events[i][k] = v; await put(m); }
async function switchCat(){ const m = await get(state.id); m.cat = m.cat==='company'?'personal':'company'; if(!SUBS[m.cat].includes(m.sub)) m.sub='기타'; await put(m); renderDetail(); }
async function saveTranscript(){ const m = await get(state.id); m.transcript = document.getElementById('tr').value; await put(m); processMemo(m.id); }
async function removeMemo(){ if(!confirm('이 메모를 삭제할까요? 녹음·사진 파일도 함께 지워집니다.')) return; await del(state.id); go('tab'); }

/* ---------- 설정 ---------- */
function renderSettings(){
  state.view = 'settings'; document.body.dataset.view = 'page';
  $app.innerHTML = `<header class="top page-top"><button class="ibtn" onclick="go('tab')" aria-label="뒤로">${IC.back}</button><h1>설정</h1><span></span></header>
  <main class="main">
    <section class="blk">
      <h3>AI 연결</h3>
      <label class="lbl">OpenAI API 키 · 음성을 글로</label>
      <input class="field" type="password" id="k1" value="${esc(S.get('openai'))}" placeholder="sk-...">
      <label class="lbl">Claude API 키 · 정리와 사진 분석</label>
      <input class="field" type="password" id="k2" value="${esc(S.get('anthropic'))}" placeholder="sk-ant-...">
      <p class="hint-line">키는 이 폰에만 저장되고 코드나 GitHub에는 들어가지 않습니다.</p>
      <button class="btn ghost sm" onclick="if(importGobangKeys(true)){alert('골방 키를 가져왔습니다.');renderSettings()}else alert('골방 키를 찾지 못했습니다. 골방과 같은 주소(24aug30.github.io)에서 열었는지 확인해 주세요.')">골방 키 가져오기</button>
    </section>
    <section class="blk">
      <h3>정확도 높이기</h3>
      <label class="lbl">자주 나오는 이름·용어</label>
      <textarea id="vc" class="field" placeholder="예: 하나스프링, CPA, 기품원, 52CrMoV4, 볼스터 스프링">${esc(S.get('vocab'))}</textarea>
      <p class="hint-line">글로 바꿀 때 오타가 줄고 태그가 정확해집니다.</p>
      <label class="lbl">전사 모델</label><input class="field" id="m1" value="${esc(S.get('sttModel','whisper-1'))}">
      <label class="lbl">정리 모델</label><input class="field" id="m2" value="${esc(S.get('claudeModel','claude-sonnet-5-5'))}">
    </section>
    <button class="btn primary company wide" onclick="saveSettings()">설정 저장</button>
    <section class="blk">
      <h3>백업</h3>
      <p class="hint-line">메모 내용을 파일로 내보내고 가져옵니다. 녹음·사진 파일은 빠지고 사진 분석 글은 포함됩니다.</p>
      <div class="pa-foot"><button class="btn ghost sm" onclick="exportJson()">내보내기</button>
      <label class="btn ghost sm">가져오기<input type="file" accept=".json" hidden onchange="importJson(this.files[0])"></label></div>
    </section>
  </main>`;
}
function saveSettings(){
  S.set('openai', document.getElementById('k1').value.trim());
  S.set('anthropic', document.getElementById('k2').value.trim());
  S.set('vocab', document.getElementById('vc').value.trim());
  S.set('sttModel', document.getElementById('m1').value.trim() || 'whisper-1');
  S.set('claudeModel', document.getElementById('m2').value.trim() || 'claude-sonnet-5-5');
  alert('설정을 저장했습니다.'); go('tab');
}
async function exportJson(){
  const data = (await all()).map(({audio,...r}) => ({...r, photos:(r.photos||[]).map(({blob,...p})=>p)}));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}));
  a.download = 'sorimemo-backup-'+kstDate(Date.now())+'.json'; a.click();
}
async function importJson(file){
  if(!file) return;
  try{ const arr = JSON.parse(await file.text()); let n = 0;
    for(const m of arr){ if(m.id && !(await get(m.id))){ await put({...m, audio:null, photos:[]}); n++; } }
    alert(`새 메모 ${n}개를 가져왔습니다.`); go('tab'); }
  catch(e){ alert('가져오지 못했습니다: '+e.message); }
}

/* ---------- 시작 ---------- */
(async()=>{ for(const m of await all()){
  if((m.photos||[]).some(p=>p.status==='analyzing')){ m.photos.forEach(p=>{ if(p.status==='analyzing') p.status='idle'; }); await put(m); }
  if(m.status==='transcribing'||m.status==='analyzing') processMemo(m.id);
} })();
go('tab');
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
